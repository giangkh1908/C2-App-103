name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: self-hosted
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend/frontend changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          backend=false
          frontend=false

          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            > changed-files.txt

          echo "Changed files:"
          cat changed-files.txt

          while IFS= read -r file; do
            case "$file" in
              backend/*|compose.yml|.github/workflows/ci.yml)
                backend=true
                ;;
            esac

            case "$file" in
              frontend/*|compose.yml|.github/workflows/ci.yml)
                frontend=true
                ;;
            esac
          done < changed-files.txt

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  backend-fast:
    name: Backend fast checks
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: self-hosted
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Unit/component tests
        run: pytest tests/unit tests/agents tests/tools -n auto --dist=loadfile -q

  backend-integration:
    name: Backend integration tests
    needs: [changes, backend-fast]
    if: ${{ always() && needs.changes.outputs.backend == 'true' && needs.backend-fast.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      MONGO_CONTAINER: ci-mongo-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Ensure mongo:7 image cached
        run: docker image inspect mongo:7 >/dev/null 2>&1 || docker pull mongo:7

      - name: Start MongoDB
        run: |
          docker rm -f "${{ env.MONGO_CONTAINER }}" 2>/dev/null || true
          docker run -d --name "${{ env.MONGO_CONTAINER }}" -P mongo:7
          MONGO_PORT=$(docker inspect "${{ env.MONGO_CONTAINER }}" \
            --format='{{(index (index .NetworkSettings.Ports "27017/tcp") 0).HostPort}}')
          echo "MongoDB started on port $MONGO_PORT"
          echo "MONGO_PORT=$MONGO_PORT" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if docker exec "${{ env.MONGO_CONTAINER }}" mongosh --quiet \
              --eval "db.adminCommand('ping')" >/dev/null 2>&1; then
              echo "MongoDB ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::MongoDB not ready after 30s"
          exit 1

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Integration tests
        env:
          PRACTICE_TEST_MONGODB_URI: mongodb://127.0.0.1:${{ env.MONGO_PORT }}
        run: pytest tests/integration -n auto --dist=loadfile --cov=src --cov-report=term-missing -v

      - name: Cleanup MongoDB
        if: always()
        run: docker rm -f "${{ env.MONGO_CONTAINER }}" 2>/dev/null || true

  backend-docker:
    name: Backend docker build
    needs: [changes, backend-integration]
    if: ${{ always() && needs.changes.outputs.backend == 'true' && needs.backend-integration.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Docker build check
        run: docker build -t backend-test-${{ github.run_id }} .

      - name: Cleanup image
        if: always()
        run: docker rmi backend-test-${{ github.run_id }} 2>/dev/null || true

  frontend-fast:
    name: Frontend fast checks
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: self-hosted
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Tests (vitest)
        run: npm run test -- --run

  frontend-build:
    name: Frontend build
    needs: [changes, frontend-fast]
    if: ${{ always() && needs.changes.outputs.frontend == 'true' && needs.frontend-fast.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Next.js build
        run: npm run build

  frontend-docker:
    name: Frontend docker build
    needs: [changes, frontend-build]
    if: ${{ always() && needs.changes.outputs.frontend == 'true' && needs.frontend-build.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Docker build check
        run: docker build -t frontend-test-${{ github.run_id }} .

      - name: Cleanup image
        if: always()
        run: docker rmi frontend-test-${{ github.run_id }} 2>/dev/null || true

  ci-gate:
    name: ci-gate
    needs:
      - changes
      - backend-fast
      - backend-integration
      - backend-docker
      - frontend-fast
      - frontend-build
      - frontend-docker
    if: ${{ always() }}
    runs-on: self-hosted
    steps:
      - name: Validate required checks
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          BACKEND_FAST: ${{ needs.backend-fast.result }}
          BACKEND_INTEGRATION: ${{ needs.backend-integration.result }}
          BACKEND_DOCKER: ${{ needs.backend-docker.result }}
          FRONTEND_FAST: ${{ needs.frontend-fast.result }}
          FRONTEND_BUILD: ${{ needs.frontend-build.result }}
          FRONTEND_DOCKER: ${{ needs.frontend-docker.result }}
        run: |
          set -euo pipefail

          failed=0

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes job failed or was skipped: $CHANGES_RESULT"
            exit 1
          fi

          check_required() {
            local scope="$1"
            local changed="$2"
            shift 2

            if [ "$changed" != "true" ]; then
              echo "$scope unchanged; related jobs may be skipped."
              return
            fi

            for item in "$@"; do
              local name="${item%%=*}"
              local result="${item#*=}"
              if [ "$result" != "success" ]; then
                echo "::error::$name did not pass: $result"
                failed=1
              else
                echo "$name passed."
              fi
            done
          }

          check_required \
            "backend" \
            "$BACKEND_CHANGED" \
            "backend-fast=$BACKEND_FAST" \
            "backend-integration=$BACKEND_INTEGRATION" \
            "backend-docker=$BACKEND_DOCKER"

          check_required \
            "frontend" \
            "$FRONTEND_CHANGED" \
            "frontend-fast=$FRONTEND_FAST" \
            "frontend-build=$FRONTEND_BUILD" \
            "frontend-docker=$FRONTEND_DOCKER"

          if [ "$BACKEND_CHANGED" != "true" ] && [ "$FRONTEND_CHANGED" != "true" ]; then
            echo "No backend/frontend changes detected; CI gate passes."
          fi

          exit "$failed"
