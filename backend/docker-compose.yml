services:
  mongo-practice-test:
    image: mongo:7.0
    container_name: c2-app-103-mongo-practice-test
    restart: unless-stopped
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - mongo-practice-test-data:/data/db

volumes:
  mongo-practice-test-data:
