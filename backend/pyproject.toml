[project]
name = "toan-truc-quan-backend"
version = "0.1.0"
description = "FastAPI backend for Toán Trực Quan AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "motor>=3.5.0",
    "pymongo>=4.8.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<4.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "google-auth>=2.29.0",
    "requests>=2.32.0",
    "structlog>=24.1.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
observability = [
    "langfuse>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "mongomock-motor>=0.0.35",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
